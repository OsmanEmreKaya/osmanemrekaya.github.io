<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Osman Emre Kaya</title>
<meta name="description" content="Mobile games and apps by Osman Emre Kaya.">
<link rel="icon" href="assets/icon.webp" type="image/webp">
<style>
/* Same font and the same candy/neon palette as the game site. */

@font-face {
  font-family: 'Baloo 2'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fontlar/baloo2-latin-ext.woff2') format('woff2');
  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
}
@font-face {
  font-family: 'Baloo 2'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fontlar/baloo2-latin.woff2') format('woff2');
  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
}

:root {
  --mor-koyu: #170a2e;
  --mor-kart: rgba(255, 255, 255, .06);
  --pembe: #ff3d92;
  --mavi: #22a7ff;
  --yazi: #f4efff;
  --yazi-sonuk: #bdb0d8;
  --kenar: rgba(255, 255, 255, .12);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  display: flex; align-items: center; justify-content: center;
  padding: 48px 20px;
  font-family: 'Baloo 2', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, system-ui, sans-serif;
  font-weight: 500;
  color: var(--yazi);
  background:
    radial-gradient(60% 50% at 20% 0%, rgba(255, 61, 146, .20), transparent 70%),
    radial-gradient(55% 45% at 85% 15%, rgba(34, 167, 255, .18), transparent 70%),
    var(--mor-koyu);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

.kap { width: 100%; max-width: 560px; }

h1 {
  margin: 0;
  font-size: clamp(30px, 7vw, 42px);
  font-weight: 800;
  letter-spacing: -.5px;
}

.alt {
  margin: 6px 0 32px;
  color: var(--yazi-sonuk);
  font-size: 17px;
}

.kart {
  display: flex; align-items: center; gap: 16px;
  padding: 18px;
  background: var(--mor-kart);
  border: 1px solid var(--kenar);
  border-radius: 20px;
  color: var(--yazi);
  text-decoration: none;
  transition: border-color .18s, transform .18s;
}
.kart:hover { border-color: var(--pembe); transform: translateY(-2px); }

.kart img {
  width: 62px; height: 62px;
  border-radius: 15px;
  flex-shrink: 0;
  display: block;
}

.kart b { display: block; font-size: 19px; font-weight: 800; }
.kart span { color: var(--yazi-sonuk); font-size: 15px; }

nav {
  margin-top: 28px;
  display: flex; flex-wrap: wrap; gap: 8px 20px;
  font-size: 15px;
}
nav a { color: var(--mavi); text-decoration: none; font-weight: 600; }
nav a:hover { text-decoration: underline; }

footer {
  margin-top: 36px;
  color: var(--yazi-sonuk);
  font-size: 14px;
}

@media (max-width: 420px) {
  .kart { gap: 13px; padding: 15px; }
  .kart img { width: 52px; height: 52px; border-radius: 13px; }
}
</style>
</head>
<body>
<main class="kap">
  <h1>Osman Emre Kaya</h1>
  <p class="alt">I build mobile games and apps.</p>

  <a class="kart" href="https://osmanemrekaya.github.io/stretchescapewebsite/">
    <img src="assets/icon.webp" alt="Stretch Escape icon" width="62" height="62">
    <span>
      <b>Stretch Escape</b>
      <span>A cozy grid puzzle. One cat. One line. Every tile. — iOS</span>
    </span>
  </a>

  <nav>
    <a href="https://osmanemrekaya.github.io/stretchescapewebsite/support.html">Support</a>
    <a href="https://osmanemrekaya.github.io/stretchescapewebsite/privacy.html">Privacy</a>
    <a href="https://github.com/OsmanEmreKaya">GitHub</a>
  </nav>

  <footer>&copy; 2026 Osman Emre Kaya &amp; Muhammed Baha Karadağlı · Our Games Studios</footer>
</main>
</body>
</html>
